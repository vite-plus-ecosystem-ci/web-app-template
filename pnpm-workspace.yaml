  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
